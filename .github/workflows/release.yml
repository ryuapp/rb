name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Build release
        run: deno task release
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} dist/*.zip --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
